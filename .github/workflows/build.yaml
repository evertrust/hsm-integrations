name: Build

on:
  repository_dispatch:
    types: [build_hsm_images]
  workflow_dispatch:
    inputs:
      baseImage:
        description: Base image
        required: true
jobs:
  build:
    runs-on: ${{ vars.RUNS_ON }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: oras-project/setup-oras@v1
      - name: Fetch Harbor credentials via Vault
        uses: hashicorp/vault-action@v4
        with:
          url: ${{ vars.VAULT_ADDR }}
          method: ${{ vars.VAULT_AUTH_METHOD }}
          path: ${{ vars.VAULT_AUTH_PATH }}
          secrets: |
            ci/data/repositories/evertrust/hsm-integrations/registry registry | REGISTRY_HOST ;
            ci/data/repositories/evertrust/hsm-integrations/registry project | REGISTRY_URL ;
            ci/data/repositories/evertrust/hsm-integrations/registry username | REGISTRY_USERNAME ;
            ci/data/repositories/evertrust/hsm-integrations/registry password | REGISTRY_PASSWORD ;

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_HOST }}
          username: ${{ env.REGISTRY_USERNAME }}
          password: ${{ env.REGISTRY_PASSWORD }}
      - run: make build BASE_IMAGE=${{ github.event.client_payload.baseImage || github.event.inputs.baseImage }}
